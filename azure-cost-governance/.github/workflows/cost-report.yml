# ──────────────────────────────────────────────────────────────────────────────
# Weekly Cost Report — scheduled idle-resource scan + cost summary
# ──────────────────────────────────────────────────────────────────────────────
# Runs every Monday at 08:00 UTC.  Can also be triggered manually.

name: "Weekly Cost Report"

on:
  schedule:
    # Every Monday at 08:00 UTC — aligns with start of business week.
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  cost-report:
    name: "Generate Cost & Idle-Resource Report"
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: azure-cost-governance/scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r azure-cost-governance/scripts/requirements.txt

      # ── Cost Report ────────────────────────────────────────────────────
      - name: Generate weekly cost report
        working-directory: azure-cost-governance/scripts
        run: |
          python generate_cost_report.py \
            --subscription-id "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --days 7 \
            --output json > /tmp/cost-report.json

          echo "### 💰 Weekly Cost Report" >> "$GITHUB_STEP_SUMMARY"
          python generate_cost_report.py \
            --subscription-id "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --days 7 \
            --output table >> "$GITHUB_STEP_SUMMARY"

      # ── Idle Resources ─────────────────────────────────────────────────
      # The script exits non-zero when idle resources exist.  We use
      # continue-on-error so the workflow still uploads results.
      - name: Detect idle resources
        id: idle
        continue-on-error: true
        working-directory: azure-cost-governance/scripts
        run: |
          python find_idle_resources.py \
            --subscription-id "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --output json > /tmp/idle-resources.json

          echo "### 🧹 Idle Resources" >> "$GITHUB_STEP_SUMMARY"
          python find_idle_resources.py \
            --subscription-id "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --output table >> "$GITHUB_STEP_SUMMARY"

      # ── Upload artifacts for auditing ──────────────────────────────────
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: cost-governance-reports
          path: |
            /tmp/cost-report.json
            /tmp/idle-resources.json
          retention-days: 90
