name: Bicep Validate (What-If)

on:
  pull_request:
    branches: [main]
    paths: ['**.bicep', '**.bicepparam']

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  LOCATION: eastus2

jobs:
  validate:
    name: What-If Preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep Lint
        run: az bicep build --file main.bicep --stdout > /dev/null

      - name: What-If (dev)
        id: whatif
        run: |
          result=$(az deployment sub what-if \
            --location ${{ env.LOCATION }} \
            --template-file main.bicep \
            --parameters environments/dev.bicepparam \
            --no-pretty-print 2>&1) || true
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$result" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post What-If to PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Bicep What-If Results 🔍
            \`\`\`
            ${{ steps.whatif.outputs.result }}
            \`\`\`
            *Triggered by @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output.substring(0, 65536)
            });
