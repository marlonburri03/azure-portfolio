name: Deploy Observability Stack

on:
  push:
    branches: [main]
    paths:
      - "azure-observability-stack/**"
  pull_request:
    branches: [main]
    paths:
      - "azure-observability-stack/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

# OIDC — no stored secrets needed. The GitHub Actions runner exchanges a
# short-lived token with Azure AD using federated credentials.
permissions:
  id-token: write   # Required for OIDC token request
  contents: read

env:
  TERRAFORM_VERSION: "1.7.0"
  WORKING_DIR: "azure-observability-stack/infra"

jobs:
  # ---------------------------------------------------------------------------
  # Validate — runs on every PR to catch misconfigurations early.
  # ---------------------------------------------------------------------------
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # ---------------------------------------------------------------------------
  # Plan — shows what will change before applying. Plan output is posted as a
  # PR comment so reviewers can approve infrastructure changes.
  # ---------------------------------------------------------------------------
  plan:
    name: Terraform Plan (${{ matrix.environment }})
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        environment: [dev]
    environment: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=observability-${{ matrix.environment }}.tfstate"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file="../environments/${{ matrix.environment }}.tfvars" \
            -out=tfplan \
            -no-color
        env:
          # Webhook URLs passed as env vars to avoid storing in tfvars files.
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          TF_VAR_teams_webhook_url: ${{ secrets.TEAMS_WEBHOOK_URL }}

  # ---------------------------------------------------------------------------
  # Deploy — applies the plan on push to main or manual dispatch.
  # ---------------------------------------------------------------------------
  deploy:
    name: Terraform Apply (${{ github.event.inputs.environment || 'dev' }})
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=observability-${{ github.event.inputs.environment || 'dev' }}.tfstate"

      - name: Terraform Apply
        run: |
          terraform apply \
            -var-file="../environments/${{ github.event.inputs.environment || 'dev' }}.tfvars" \
            -auto-approve
        env:
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          TF_VAR_teams_webhook_url: ${{ secrets.TEAMS_WEBHOOK_URL }}
