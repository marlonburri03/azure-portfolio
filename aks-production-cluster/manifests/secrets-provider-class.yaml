# SecretProviderClass — maps Azure Key Vault secrets to pod-mounted files.
#
# The Secrets Store CSI Driver uses this CRD to know which secrets to fetch
# and how to authenticate. With Workload Identity, the driver uses the
# pod's federated service account token — no client secrets or certificates.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-secrets
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/part-of: aks-production-cluster
spec:
  provider: azure

  parameters:
    # Use Workload Identity instead of managed identity or service principal.
    # The CSI driver exchanges the pod's projected SA token for an Azure AD token.
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<WORKLOAD_IDENTITY_CLIENT_ID>"

    # Key Vault coordinates — populated by Terraform outputs
    keyvaultName: "<KEY_VAULT_NAME>"
    tenantId: "<AZURE_TENANT_ID>"

    # Objects to sync — each entry becomes a file under the mount path
    objects: |
      array:
        - |
          objectName: db-connection-string
          objectType: secret
          objectVersion: ""
        - |
          objectName: api-key
          objectType: secret
          objectVersion: ""

  # Optionally sync CSI-mounted secrets to Kubernetes Secret objects.
  # Useful when environment variables are preferred over file mounts.
  secretObjects:
    - secretName: sample-app-secrets
      type: Opaque
      data:
        - objectName: db-connection-string
          key: DB_CONNECTION_STRING
        - objectName: api-key
          key: API_KEY
