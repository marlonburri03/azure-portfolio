# =============================================================================
# Template: Terraform Plan
# =============================================================================
# Reusable template that runs terraform plan and publishes the plan artifact.
# Called by the parent pipeline for each environment.
# =============================================================================

parameters:
  - name: environment
    type: string
  - name: serviceConnection
    type: string
  - name: workingDirectory
    type: string
  - name: backendResourceGroup
    type: string
  - name: backendStorageAccount
    type: string
  - name: backendContainer
    type: string
  - name: backendKey
    type: string

jobs:
  - job: Plan
    displayName: "Plan (${{ parameters.environment }})"
    steps:
      - task: TerraformInstaller@1
        displayName: "Install Terraform"
        inputs:
          terraformVersion: $(TF_VERSION)

      # AzureCLI task handles OIDC token exchange automatically when the
      # service connection is configured with Workload Identity Federation
      - task: AzureCLI@2
        displayName: "Terraform Init"
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          scriptType: "bash"
          scriptLocation: "inlineScript"
          # addSpnToEnvironment exposes ARM_CLIENT_ID, ARM_TENANT_ID, etc.
          # so Terraform's azurerm backend can authenticate via OIDC
          addSpnToEnvironment: true
          workingDirectory: ${{ parameters.workingDirectory }}
          inlineScript: |
            export ARM_USE_OIDC=true
            export ARM_CLIENT_ID=$servicePrincipalId
            export ARM_TENANT_ID=$tenantId
            export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

            terraform init \
              -backend-config="resource_group_name=${{ parameters.backendResourceGroup }}" \
              -backend-config="storage_account_name=${{ parameters.backendStorageAccount }}" \
              -backend-config="container_name=${{ parameters.backendContainer }}" \
              -backend-config="key=${{ parameters.backendKey }}" \
              -backend-config="use_oidc=true"

      - task: AzureCLI@2
        displayName: "Terraform Plan"
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          scriptType: "bash"
          scriptLocation: "inlineScript"
          addSpnToEnvironment: true
          workingDirectory: ${{ parameters.workingDirectory }}
          inlineScript: |
            export ARM_USE_OIDC=true
            export ARM_CLIENT_ID=$servicePrincipalId
            export ARM_TENANT_ID=$tenantId
            export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

            terraform plan \
              -no-color \
              -detailed-exitcode \
              -var-file="environments/${{ parameters.environment }}.tfvars" \
              -out=$(Build.ArtifactStagingDirectory)/tfplan

            # Exit code 2 = changes detected (not a failure)
            PLAN_EXIT=$?
            if [ "$PLAN_EXIT" -eq 1 ]; then
              echo "##[error] Terraform plan failed"
              exit 1
            fi
            echo "##vso[task.setvariable variable=planHasChanges]$([ $PLAN_EXIT -eq 2 ] && echo true || echo false)"

      # Publish plan as pipeline artifact so the apply stage uses the exact
      # same plan that was reviewed — prevents drift between plan and apply
      - publish: $(Build.ArtifactStagingDirectory)/tfplan
        artifact: "tfplan-${{ parameters.environment }}"
        displayName: "Publish Plan Artifact"
