# =============================================================================
# Template: Terraform Apply
# =============================================================================
# Reusable template that applies a previously-generated terraform plan.
# Uses a 'deployment' job to integrate with Azure DevOps Environments,
# which provides approval gates, deployment history, and audit trail.
# =============================================================================

parameters:
  - name: environment
    type: string
  - name: serviceConnection
    type: string
  - name: workingDirectory
    type: string
  - name: dependsOn
    type: string
    default: "Plan"

jobs:
  # 'deployment' job type integrates with Azure DevOps Environments for:
  # - Manual approval gates (configured in Environment settings)
  # - Deployment history and audit trail
  # - Exclusive lock to prevent concurrent deployments to same environment
  - deployment: Apply
    displayName: "Apply (${{ parameters.environment }})"
    dependsOn: ${{ parameters.dependsOn }}
    # The environment name maps to an Azure DevOps Environment resource
    # Configure approval checks, business hours, and branch control there
    environment: ${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
            - task: TerraformInstaller@1
              displayName: "Install Terraform"
              inputs:
                terraformVersion: $(TF_VERSION)

            # Download the plan artifact generated in the Plan job
            # This ensures we apply exactly what was reviewed
            - download: current
              artifact: "tfplan-${{ parameters.environment }}"
              displayName: "Download Plan Artifact"

            - task: AzureCLI@2
              displayName: "Terraform Init"
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: "bash"
                scriptLocation: "inlineScript"
                addSpnToEnvironment: true
                workingDirectory: ${{ parameters.workingDirectory }}
                inlineScript: |
                  export ARM_USE_OIDC=true
                  export ARM_CLIENT_ID=$servicePrincipalId
                  export ARM_TENANT_ID=$tenantId
                  export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                  terraform init \
                    -backend-config="resource_group_name=$(TF_STATE_RG)" \
                    -backend-config="storage_account_name=$(TF_STATE_SA)" \
                    -backend-config="container_name=tfstate" \
                    -backend-config="key=${{ parameters.environment }}.terraform.tfstate" \
                    -backend-config="use_oidc=true"

            - task: AzureCLI@2
              displayName: "Terraform Apply"
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: "bash"
                scriptLocation: "inlineScript"
                addSpnToEnvironment: true
                workingDirectory: ${{ parameters.workingDirectory }}
                inlineScript: |
                  export ARM_USE_OIDC=true
                  export ARM_CLIENT_ID=$servicePrincipalId
                  export ARM_TENANT_ID=$tenantId
                  export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                  # Apply the saved plan file — ensures what was reviewed is what deploys
                  terraform apply \
                    -no-color \
                    -auto-approve \
                    $(Pipeline.Workspace)/tfplan-${{ parameters.environment }}/tfplan

            # Capture outputs for downstream stages (e.g., AKS cluster name)
            - task: AzureCLI@2
              displayName: "Export Terraform Outputs"
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: "bash"
                scriptLocation: "inlineScript"
                addSpnToEnvironment: true
                workingDirectory: ${{ parameters.workingDirectory }}
                inlineScript: |
                  export ARM_USE_OIDC=true
                  export ARM_CLIENT_ID=$servicePrincipalId
                  export ARM_TENANT_ID=$tenantId
                  export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                  # Write outputs as pipeline variables for downstream consumption
                  terraform output -json | jq -r 'to_entries[] | "##vso[task.setvariable variable=tf_\(.key);isOutput=true]\(.value.value)"'
