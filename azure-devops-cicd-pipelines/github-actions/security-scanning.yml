# =============================================================================
# Security Scanning Pipeline — Checkov, tfsec, Microsoft Defender for DevOps
# =============================================================================
# Runs multiple complementary security scanners to maximize coverage:
#   - Checkov: broad IaC policy engine (Terraform, ARM, Kubernetes, Dockerfile)
#   - tfsec:   Terraform-specific deep analysis with Azure-aware rules
#   - MSDO:    Microsoft Defender for DevOps (integrates with Defender for Cloud)
# Results are uploaded to GitHub Security tab (SARIF) for unified triage.
# =============================================================================

name: "Security Scanning"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run weekly to catch newly-discovered CVEs in unchanged code
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC

permissions:
  id-token: write        # OIDC for Defender for DevOps
  contents: read
  security-events: write # Upload SARIF results
  pull-requests: write   # Comment scan summaries on PRs

env:
  TF_WORKING_DIR: "infrastructure"

jobs:
  # ---------------------------------------------------------------------------
  # Checkov: policy-as-code scanner for IaC, Dockerfiles, and K8s manifests
  # ---------------------------------------------------------------------------
  checkov:
    name: "Checkov Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          # Soft-fail on PRs to avoid blocking development; hard-fail on main
          soft_fail: ${{ github.event_name == 'pull_request' }}
          # Skip checks that conflict with our tagging strategy
          skip_check: "CKV_AZURE_35"
          # Download the latest Checkov rules on each run
          download_external_modules: "true"

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  # ---------------------------------------------------------------------------
  # tfsec: Terraform-specific security scanner with deep HCL analysis
  # ---------------------------------------------------------------------------
  tfsec:
    name: "tfsec Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          format: sarif
          sarif_file: tfsec-results.sarif
          # Soft-fail on PRs; tfsec is stricter than Checkov on some rules
          soft_fail: ${{ github.event_name == 'pull_request' }}
          additional_args: |
            --minimum-severity HIGH
            --exclude-downloaded-modules

      - name: Upload tfsec SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec

  # ---------------------------------------------------------------------------
  # Microsoft Defender for DevOps: connects to Microsoft Defender for Cloud
  # ---------------------------------------------------------------------------
  defender:
    name: "Defender for DevOps"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OIDC login — Defender for DevOps requires an authenticated Azure session
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # MSDO runs multiple Microsoft security tools in a single step:
      # - Template Analyzer (ARM/Bicep), Terrascan, Trivy, etc.
      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@v1
        id: msdo
        with:
          # Categories to scan — IaC covers Terraform, ARM, and Bicep
          categories: "IaC,containers"
          # Tools to include (subset for speed; full suite available)
          tools: "templateanalyzer,terrascan,trivy"

      - name: Upload MSDO SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
          category: msdo

  # ---------------------------------------------------------------------------
  # Summary: aggregate results and post a PR comment
  # ---------------------------------------------------------------------------
  summary:
    name: "Security Summary"
    runs-on: ubuntu-latest
    needs: [checkov, tfsec, defender]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Post Summary Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const jobs = {
              checkov: '${{ needs.checkov.result }}',
              tfsec: '${{ needs.tfsec.result }}',
              defender: '${{ needs.defender.result }}',
            };

            const icon = (status) => {
              if (status === 'success') return '✅';
              if (status === 'failure') return '❌';
              return '⚠️';
            };

            const rows = Object.entries(jobs)
              .map(([name, status]) => `| ${name} | ${icon(status)} ${status} |`)
              .join('\n');

            const body = `### 🔒 Security Scan Results

            | Scanner | Status |
            |---------|--------|
            ${rows}

            > View detailed findings in the **Security** tab → **Code scanning alerts**

            *Triggered by @${{ github.actor }} on \`${{ github.head_ref }}\`*`;

            // Upsert comment to avoid clutter on re-runs
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Security Scan Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
